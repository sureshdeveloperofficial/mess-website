services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mess-website-app
    restart: unless-stopped
    ports:
      - "7691:7691"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=7691
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:7691/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
